name: Update packages

on:
  push:
    branches:
      - main
    paths:
      - 'pkgs/**'
      - 'nvfetcher.toml'
      - '.github/workflows/update.yml'
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    name: Update package sources and hashes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Maximize Nix disk space
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Set up Nix
      uses: mzwing/nix-config/.github/actions/setup-nix@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        install-devenv: 'true'

    # The nix-ci- store cache family has exactly ONE writer: this job.
    # The readers (the config job of build.yml, tests.yml) restore with
    # the nix-ci- prefix but never save — cache-nix-action skips the
    # save on an exact primary-key hit, so whichever job saved first
    # used to win, and its small store (no toolchain) poisoned the
    # family. The key hashes the lock inputs; purge keeps at most the
    # entry just saved (protected by purge-primary-key: never) and the
    # one it was restored from (restore refreshes its last-accessed
    # time). The action also removes stale root-owned store lock files
    # (left behind by interrupted builds or substitutions of earlier
    # runs; they break the unprivileged tar of the post-run store save).
    - name: Restore Nix store
      uses: mzwing/nix-config/.github/actions/restore-nix-store@master
      with:
        primary-key: nix-ci-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix', 'devenv.yaml', 'nvfetcher.toml') }}
        restore-prefix: nix-ci-
        gc-max-store-size-linux: 4G

    - name: Restore nvfetcher database
      uses: actions/cache@v6
      with:
        path: ~/.local/share/nvfetcher
        key: nvfetcher-${{ github.sha }}
        restore-keys: |
          nvfetcher-

    - name: Update devenv inputs
      run: devenv update

    - name: Update sources, lockfiles and dependency hashes
      shell: bash
      run: |
        set -euo pipefail
        trap 'rm -f secrets.toml' EXIT

        # nothing-but-nix cleaves almost all disk into the /nix mount and
        # leaves / with ~1G. The gomod2nix module downloads (and
        # crate2nix's cargo registry) overflow / unless their caches live
        # on the big mount. /nix itself is root-owned, so create the
        # directories with sudo first.
        export GOMODCACHE=/nix/var/tmp/gomodcache
        export CARGO_HOME=/nix/var/tmp/cargo
        sudo mkdir -p "$GOMODCACHE" "$CARGO_HOME"
        sudo chown "$(id -u):$(id -g)" "$GOMODCACHE" "$CARGO_HOME"

        cat >secrets.toml <<EOF
        [keys]
        github = "${{ secrets.GITHUB_TOKEN }}"
        EOF

        nix run .#update-sources

        nix run .#update-lockfiles

        nix run .#update-hashes

        rm -f secrets.toml
        trap - EXIT

    # Root the update toolchain (nvfetcher, gomod2nix, crate2nix, ...)
    # so the store GC in the save phase (gc-max-store-size-linux) cannot
    # evict it: restored cache entries carry no gcroots, so without this
    # every path is collectable and the daily toolchain re-download
    # (~500 MiB) never stops. The app scripts reference the tools via
    # runtimeInputs, so rooting the scripts roots the whole closures.
    - name: Root the update toolchain for the store cache
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        sudo install -d /nix/var/nix/gcroots/nur-ci-update
        for app in update-sources update-lockfiles update-hashes; do
          program="$(nix eval --raw ".#apps.x86_64-linux.${app}.program")"
          [[ -e "${program}" ]] || continue
          sudo ln -sfn "${program}" "/nix/var/nix/gcroots/nur-ci-update/${app}"
        done

    - name: Commit and push changes
      uses: mzwing/nix-config/.github/actions/commit-and-push@master
      with:
        paths: devenv.lock flake.lock _sources pkgs
        message: 'chore: update packages'
        trigger-workflow: build.yml
        github-token: ${{ github.token }}

    # actions/cache has no built-in purge, so prune old nvfetcher
    # databases manually: keep only the newest entry (the one the
    # restore step above picked); the post-job save then adds the new
    # one, leaving at most two nvfetcher caches around.
    - name: Purge old nvfetcher caches
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh cache list --limit 100 --json id,key,createdAt |
          jq -r '[.[] | select(.key | startswith("nvfetcher-"))] | sort_by(.createdAt) | .[:-1][] | .id' |
          xargs -r -n 1 gh cache delete
